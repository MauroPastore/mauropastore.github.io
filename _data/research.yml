# Research page content.

summary: >-
  Statistical physics is the science of how many interacting parts behave collectively, whether atoms in a fluid, neurons in a network or the residues of a protein. My research sits at the crossroads of statistical physics, computer science and biology.

themes:
  - id: deepl
    title: "Asymptotics of feature learning in deep neural networks"
    image: "/images/theme-deep-learning.gif"
    image_alt: "Animated deep neural network lighting up layer by layer"
    text: "Statistical-mechanics theory of when and how deep networks go beyond kernel behavior, from random features and lazy training to the specialization transition near interpolation."
  - id: struct
    title: "Machine learning of structured data"
    image: "/images/theme-structured-data.png"
    image_alt: "Classification of points on low-dimensional simplexes"
    text: "How data structure shapes learning, from geometrically structured inputs to class imbalance."
  - id: bio
    title: "Inference methods for biology"
    image: "/images/theme-biology.svg"
    image_alt: "An RBM whose visible units are RNA nucleotides"
    text: "Biological data classification with severely imbalanced training sets, modeling experiments of *directed evolution* of biological molecules via unsupervised methods."
  - id: rnn
    title: "Non-reciprocal synaptic connections in recurrent neural networks"
    text: "Storage capacity of recurrent neural networks with asymmetric couplings, as minimal models of biological synapses."
    image: "/images/theme-recurrent-networks.gif"
    image_alt: "A stored memory, the ICTP logo, retrieved from a noisy configuration"
  - id: spin
    title: "Theory of spin glasses"
    image: "/images/theme-spin-glasses.png"
    image_alt: "A rugged energy landscape"
    text: "Large deviations of the free energy in disordered systems, glassy behavior in frustrated spin models without quenched disorder, quantum perceptrons."
  - id: qft
    title: "Non-perturbative quantum field theory"
    image: "/images/theme-qft.svg"
    image_alt: "Triangle diagram of the axial anomaly: an axial current coupled to two gluons through a quark loop"
    text: "Deriving effective theories of composite particles from first principles."

